[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-move-predictor"
version = "1.0.0"
description = "Predict stock movements after earnings using options data"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Earnings Predictor Team" }]
keywords = ["earnings", "options", "stocks", "trading", "finance", "prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
premium = [
    "tradingeconomics>=0.3.0",
    "ib_insync>=0.9.86",
    "polygon-api-client>=1.12.0",
    "alpha_vantage>=2.3.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
earnings-predict = "src.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src", "src.*"]
